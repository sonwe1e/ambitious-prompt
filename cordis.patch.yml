- insert:
    - id: ambitious-prompt-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: ambitious-prompt
        includeDefaultRoots: false
        customSkillDirs:
          - __jsExpr: "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@sonwe1e/ambitious-prompt/package.json')), 'skills')"
